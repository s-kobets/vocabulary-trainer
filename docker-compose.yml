services:
  vocabulary-app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "3001:3000"
    volumes:
      - /srv/vocabulary/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
